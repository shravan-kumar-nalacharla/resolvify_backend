spring.application.name=complaint-backend
server.port=${PORT:8081}

# H2 In-Memory Database (replaces unreachable Aiven MySQL)
spring.datasource.url=jdbc:h2:mem:complaintsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true

